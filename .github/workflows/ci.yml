name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ramo quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Nuxt) — lint, typecheck, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend (FastAPI) — ruff, mypy e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: central
          POSTGRES_PASSWORD: central
          POSTGRES_DB: central_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U central"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Banco de CI, descartável a cada execução — nunca aponta para um
      # ambiente real. Ver `backend/tests/conftest.py` (exige `.env.test`
      # e recusa truncar qualquer banco cujo nome não termine em `_test`).
      APP_ENV: test
      DATABASE_URL: postgresql://central:central@localhost:5432/central_ci_test
      MIGRATION_DATABASE_URL: postgresql://central:central@localhost:5432/central_ci_test
      ALLOW_TEST_DB_MIGRATIONS: "true"
      CORS_ORIGINS: http://localhost:3000
      DEV_AUTH_ENABLED: "true"
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Gerar .env.test para a suíte (banco descartável do serviço acima)
        run: |
          cat > .env.test <<EOF
          APP_ENV=$APP_ENV
          DATABASE_URL=$DATABASE_URL
          MIGRATION_DATABASE_URL=$MIGRATION_DATABASE_URL
          ALLOW_TEST_DB_MIGRATIONS=$ALLOW_TEST_DB_MIGRATIONS
          CORS_ORIGINS=$CORS_ORIGINS
          DEV_AUTH_ENABLED=$DEV_AUTH_ENABLED
          LOG_LEVEL=$LOG_LEVEL
          EOF

      - name: Aplicar migrations no banco de teste
        run: python -m alembic upgrade head

      - name: Lint (ruff)
        run: python -m ruff check app tests scripts

      - name: Typecheck (mypy)
        run: python -m mypy app

      - name: Testes
        run: python -m pytest
